S514CPU = A
CommPort = PRI
AUTO_PCISLOT = NO
PCISLOT = 2
PCIBUS = 4
FE_MEDIA = E1
FE_LCODE = HDB3
FE_FRAME = CRC4
FE_LINE = 1
TE_CLOCK = NORMAL
TE_REF_CLOCK = 0
TE_SIG_MODE = CCS
TE_HIGHIMPEDANCE = NO
LBO = 120OH
FE_TXTRISTATE = NO
MTU = 1500
UDPPORT = 9000
TTL = 255
IGNORE_FRONT_END = NO
TDMV_SPAN = 1
TDMV_DCHAN = 16
TDMV_HW_DTMF = NO
TDMV_HW_FAX_DETECT = NO

[w1g1]
ACTIVE_CH = ALL
TDMV_ECHO_OFF = YES
